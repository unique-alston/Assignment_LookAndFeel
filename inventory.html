<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Inventory | Hemline Clothing Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Fraunces:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<header><div class="wrap"><a class="brand" href="index.html">Hemline</a><nav aria-label="Main">
<a href="index.html">Home</a><a href="inventory.html" aria-current="page">Inventory</a><a href="analytics.html">Analytics</a><a href="aboutus.html">About us</a></nav></div></header><main><div class="wrap">
<h1>Inventory</h1><p>Add, edit, or remove products. Changes are saved in this browser only.</p>
<div class="msg" role="status" aria-live="polite" id="msg"></div>
<form id="form"><input type="hidden" id="pid">
<label>Product name<input id="name" required maxlength="40"></label>
<label>Category<select id="cat"><option>Tops</option><option>Bottoms</option><option>Outerwear</option><option>Accessories</option></select></label>
<label>Price ($)<input id="price" type="number" min="0" step="0.01" required></label>
<label>Units in stock<input id="stock" type="number" min="0" step="1" required></label>
<div class="actions"><button class="btn" id="save" type="submit">Add product</button><button class="btn ghost" id="cancel" type="button" hidden>Cancel edit</button></div></form>
<div class="tablebox"><table><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></main><footer><div class="wrap">Hemline Clothing Store &middot; ISM 6225 Assignment 1 &middot; Static demo with sample data</div></footer><script src="js/data.js"></script><script src="js/inventory.js"></script></body></html>
